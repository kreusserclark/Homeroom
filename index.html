<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Homeroom</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        text-align: center;
        font-family: Arial, sans-serif;
    }

    /* ===== HOMEROOM WELCOME SCREEN ===== */

    .welcome-container {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        position: relative;
    }

    .welcome-image {
        width: 100%;
        height: auto;
        display: block;
    }


    /* ===== CIRCULAR TEACHER VIDEO ===== */

    .teacher-video {
        position: absolute;
        left: 5%;
        bottom: 7%;
        width: 16%;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #6f2dbd;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
        cursor: pointer;
        z-index: 10;
    }

</style>
</head>


<body>


<!-- ===== HOMEROOM WELCOME SCREEN ===== -->

<div class="welcome-container">

    <!-- Your finished Homeroom graphic -->
    <img
        src="./images/welcomehr.gif"
        alt="Welcome to Homeroom"
        class="welcome-image"
    >


    <!-- Circular teacher video -->
    <video
        id="teacherVideo"
        class="teacher-video"
        src="./videos/homeroom.mp4"
        playsinline
        preload="metadata"
    >
    </video>

</div>


<!-- ===== VIDEO CONTROL ===== -->

<script>

const teacherVideo = document.getElementById("teacherVideo");

teacherVideo.addEventListener("click", function() {

    if (teacherVideo.paused) {

        teacherVideo.play();

    } else {

        teacherVideo.pause();

    }

});

</script>


</body>
</html>
